<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embroidery comes to life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bar: 0px; }
  html, body { margin: 0; height: 100%; background: #0b0908; overflow: hidden; }
  body { font-family: 'EB Garamond', Georgia, serif; color: #d9cdb8; -webkit-font-smoothing: antialiased; }
  #film { position: absolute; display: block; }
  /* controls live in the letterbox bar under the picture */
  #ui { position: absolute; left: 0; right: 0; bottom: 0; height: max(var(--bar), 44px); display: flex; align-items: center; justify-content: space-between; padding: 0 22px 4px; box-sizing: border-box; pointer-events: none; }
  #sound { pointer-events: auto; font: 500 15px/1 'EB Garamond', Georgia, serif; letter-spacing: 0.04em; color: #efe4cf; background: rgba(24, 19, 16, 0.86); border: 1px solid rgba(222, 204, 170, 0.5); border-radius: 999px; padding: 8px 16px 9px; cursor: pointer; transition: background 0.2s, border-color 0.2s, opacity 0.4s; }
  #sound:hover { background: rgba(60, 46, 34, 0.95); border-color: #e6d3ae; }
  #sound:focus-visible { outline: 2px solid #e6d3ae; outline-offset: 2px; }
  #sound.on { opacity: 0.55; }
  body.hover #sound.on, #sound.on:hover { opacity: 1; }
  #hint { font-style: italic; font-size: 15px; color: #b9ab93; opacity: 0; transition: opacity 0.5s; }
  body.hover #hint { opacity: 0.9; }
  body.tight #hint { text-shadow: 0 1px 6px rgba(0,0,0,0.9); color: #efe4cf; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; cursor: pointer; opacity: 0; transition: opacity 0.4s; }
  body.hover #bar { opacity: 1; }
  #bar::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(222, 204, 170, 0.16); }
  #bar-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #d8a23a; transform-origin: 0 50%; transform: scaleX(0); }
  #bar:hover::before, #bar:hover #bar-fill { height: 6px; }
  .nogl #film { display: none; }
  #nogl { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; font-size: 20px; }
  .nogl #nogl { display: flex; }
</style>
</head>
<body>
<canvas id="film" aria-label="A stitched scene in an embroidery hoop: a fox, a bird, a child flying a kite, grass and a sun"></canvas>
<div id="ui">
  <button id="sound" type="button">Play with sound</button>
  <span id="hint">Click the linen to stitch a flower. Space pauses.</span>
</div>
<div id="bar"><div id="bar-fill"></div></div>
<div id="nogl">This film needs WebGL2.</div>
<script src="js/shaders.js"></script>
<script src="js/stitch.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
